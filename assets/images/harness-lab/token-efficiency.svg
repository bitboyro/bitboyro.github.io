<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="1140" height="810" role="img" aria-label="Same accuracy, four times the tokens">
<style>
  svg {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --quiet1: #c9c8c2;
    --quiet2: #d8d7d2;
    --quiet3: #e4e3de;
    --quiet4: #eeede9;
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --s1: #3987e5;
      --s2: #d95926;
      --quiet1: #4a4a46;
      --quiet2: #3d3d39;
      --quiet3: #343431;
      --quiet4: #2c2c29;
    }
  }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .lbl { fill: var(--ink2); font-size: 12px; }
  .lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 10.5px; }
  .s1 { fill: var(--s1); }
  .s2 { fill: var(--s2); }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="760" height="540"/>
<text class="title" x="24" y="30">Same accuracy, four times the tokens</text>
<text class="sub" x="24" y="49">Thousands of input tokens per successful task (log scale) against graded success</text>
<line class="grid" x1="114.7" y1="78" x2="114.7" y2="448"/>
<text class="tick" x="114.7" y="466" text-anchor="middle">30k</text>
<line class="grid" x1="228.9" y1="78" x2="228.9" y2="448"/>
<text class="tick" x="228.9" y="466" text-anchor="middle">50k</text>
<line class="grid" x1="383.8" y1="78" x2="383.8" y2="448"/>
<text class="tick" x="383.8" y="466" text-anchor="middle">100k</text>
<line class="grid" x1="538.7" y1="78" x2="538.7" y2="448"/>
<text class="tick" x="538.7" y="466" text-anchor="middle">200k</text>
<line class="grid" x1="74" y1="421.6" x2="560" y2="421.6"/>
<text class="tick" x="64" y="425.6" text-anchor="end">64%</text>
<line class="grid" x1="74" y1="315.9" x2="560" y2="315.9"/>
<text class="tick" x="64" y="319.9" text-anchor="end">68%</text>
<line class="grid" x1="74" y1="210.1" x2="560" y2="210.1"/>
<text class="tick" x="64" y="214.1" text-anchor="end">72%</text>
<line class="grid" x1="74" y1="104.4" x2="560" y2="104.4"/>
<text class="tick" x="64" y="108.4" text-anchor="end">76%</text>
<line class="axis" x1="74" y1="448" x2="560" y2="448"/>
<line class="axis" x1="74" y1="78" x2="74" y2="448"/>
<text class="lbl" x="317.0" y="488" text-anchor="middle">input ktokens per success → (log)</text>
<text class="lbl" x="18" y="263.0" text-anchor="middle" transform="rotate(-90 18 263.0)">graded success</text>
<circle class="s2 ring" cx="346.7" cy="172.3" r="5.5"/>
<text class="lbl" x="358.7" y="176.3" text-anchor="start">B2-auth</text>
<text class="note" x="358.7" y="190.3" text-anchor="start">85k</text>
<circle class="s2 ring" cx="152.5" cy="126.0" r="5.5"/>
<text class="lbl" x="164.5" y="130.0" text-anchor="start">C1</text>
<text class="note" x="164.5" y="144.0" text-anchor="start">36k</text>
<circle class="s2 ring" cx="312.9" cy="194.5" r="5.5"/>
<text class="lbl" x="300.9" y="198.5" text-anchor="end">B1-auth</text>
<text class="note" x="300.9" y="212.5" text-anchor="end">73k</text>
<circle class="s2 ring" cx="173.9" cy="213.1" r="5.5"/>
<text class="lbl" x="185.9" y="217.1" text-anchor="start">D2-auth</text>
<text class="note" x="185.9" y="231.1" text-anchor="start">39k</text>
<circle class="s1 ring" cx="105.3" cy="190.7" r="7"/>
<text class="lbl-strong" x="117.3" y="194.7" text-anchor="start">D1</text>
<text class="note" x="117.3" y="208.7" text-anchor="start">29k</text>
<circle class="s1 ring" cx="423.3" cy="259.8" r="7"/>
<text class="lbl-strong" x="435.3" y="263.8" text-anchor="start">A1</text>
<text class="note" x="435.3" y="277.8" text-anchor="start">119k</text>
<circle class="s2 ring" cx="524.0" cy="407.8" r="5.5"/>
<text class="lbl" x="536.0" y="411.8" text-anchor="start">A2</text>
<text class="note" x="536.0" y="425.8" text-anchor="start">187k</text>
<text class="note" x="24" y="505">D1 and A1 are 2.6 pp apart on success — a tie under this run’s 7.1 pp floor — and 90k tokens apart per success.</text>
<text class="note" x="24" y="526">A2 is the exception: 8.2 pp below D1, the one accuracy gap here that clears the floor, and it spends 6.5× the tokens to get there.</text>
</svg>
