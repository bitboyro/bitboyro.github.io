<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="1140" height="750" role="img" aria-label="Nobody holds both corners">
<style>
  svg {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --quiet1: #c9c8c2;
    --quiet2: #d8d7d2;
    --quiet3: #e4e3de;
    --quiet4: #eeede9;
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --s1: #3987e5;
      --s2: #d95926;
      --quiet1: #4a4a46;
      --quiet2: #3d3d39;
      --quiet3: #343431;
      --quiet4: #2c2c29;
    }
  }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .lbl { fill: var(--ink2); font-size: 12px; }
  .lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 10.5px; }
  .s1 { fill: var(--s1); }
  .s2 { fill: var(--s2); }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="760" height="500"/>
