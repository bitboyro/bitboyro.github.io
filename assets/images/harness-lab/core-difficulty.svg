<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="1140" height="621" role="img" aria-label="The suite has a floor and a ceiling">
<style>
  svg {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --quiet1: #c9c8c2;
    --quiet2: #d8d7d2;
    --quiet3: #e4e3de;
    --quiet4: #eeede9;
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --s1: #3987e5;
      --s2: #d95926;
      --quiet1: #4a4a46;
      --quiet2: #3d3d39;
      --quiet3: #343431;
      --quiet4: #2c2c29;
    }
  }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .lbl { fill: var(--ink2); font-size: 12px; }
  .lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 10.5px; }
  .s1 { fill: var(--s1); }
  .s2 { fill: var(--s2); }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="760" height="414"/>
<text class="title" x="24" y="30">The suite has a floor and a ceiling</text>
<text class="sub" x="24" y="49">Per-core success across all ten arms · 80 answerable cores, 30 unanswerable</text>
<line class="grid" x1="74" y1="296.0" x2="674" y2="296.0"/>
<text class="tick" x="64" y="300.0" text-anchor="end">0</text>
<line class="grid" x1="74" y1="271.0" x2="674" y2="271.0"/>
<text class="tick" x="64" y="275.0" text-anchor="end">5</text>
<line class="grid" x1="74" y1="246.0" x2="674" y2="246.0"/>
<text class="tick" x="64" y="250.0" text-anchor="end">10</text>
<line class="grid" x1="74" y1="221.0" x2="674" y2="221.0"/>
<text class="tick" x="64" y="225.0" text-anchor="end">15</text>
<line class="grid" x1="74" y1="196.0" x2="674" y2="196.0"/>
<text class="tick" x="64" y="200.0" text-anchor="end">20</text>
<line class="grid" x1="74" y1="171.0" x2="674" y2="171.0"/>
<text class="tick" x="64" y="175.0" text-anchor="end">25</text>
<line class="grid" x1="74" y1="146.0" x2="674" y2="146.0"/>
<text class="tick" x="64" y="150.0" text-anchor="end">30</text>
<line class="grid" x1="74" y1="121.0" x2="674" y2="121.0"/>
<text class="tick" x="64" y="125.0" text-anchor="end">35</text>
<line class="grid" x1="74" y1="96.0" x2="674" y2="96.0"/>
<text class="tick" x="64" y="100.0" text-anchor="end">40</text>
<text class="tick" x="104.0" y="314" text-anchor="middle">0–10</text>
<rect x="136.0" y="211.0" width="26.0" height="85.0" rx="3" fill="var(--s1)"/>
<text class="tick" x="164.0" y="314" text-anchor="middle">10–20</text>
<text class="tick" x="224.0" y="314" text-anchor="middle">20–30</text>
<rect x="256.0" y="251.0" width="26.0" height="45.0" rx="3" fill="var(--s1)"/>
<text class="tick" x="284.0" y="314" text-anchor="middle">30–40</text>
<text class="tick" x="344.0" y="314" text-anchor="middle">40–50</text>
<rect x="376.0" y="291.0" width="26.0" height="5.0" rx="3" fill="var(--s1)"/>
<rect x="406.0" y="286.0" width="26.0" height="10.0" rx="3" fill="var(--s2)"/>
<text class="tick" x="404.0" y="314" text-anchor="middle">50–60</text>
<rect x="436.0" y="246.0" width="26.0" height="50.0" rx="3" fill="var(--s1)"/>
<rect x="466.0" y="241.0" width="26.0" height="55.0" rx="3" fill="var(--s2)"/>
<text class="tick" x="464.0" y="314" text-anchor="middle">60–70</text>
<rect x="496.0" y="106.0" width="26.0" height="190.0" rx="3" fill="var(--s1)"/>
<rect x="526.0" y="266.0" width="26.0" height="30.0" rx="3" fill="var(--s2)"/>
<text class="tick" x="524.0" y="314" text-anchor="middle">70–80</text>
<rect x="556.0" y="271.0" width="26.0" height="25.0" rx="3" fill="var(--s1)"/>
<rect x="586.0" y="281.0" width="26.0" height="15.0" rx="3" fill="var(--s2)"/>
<text class="tick" x="584.0" y="314" text-anchor="middle">80–90</text>
<rect x="646.0" y="256.0" width="26.0" height="40.0" rx="3" fill="var(--s2)"/>
<text class="tick" x="644.0" y="314" text-anchor="middle">90–100</text>
<line class="axis" x1="74" y1="296" x2="674" y2="296"/>
<text class="lbl" x="374.0" y="336" text-anchor="middle">success rate across all arms (%)</text>
<text class="lbl" x="20" y="196.0" text-anchor="middle" transform="rotate(-90 20 196.0)">cores</text>
<rect x="74" y="362" width="12" height="12" rx="3" fill="var(--s1)"/>
<text class="lbl" x="94" y="372">answerable cores</text>
<rect x="244" y="362" width="12" height="12" rx="3" fill="var(--s2)"/>
<text class="lbl" x="264" y="372">unanswerable cores</text>
<text class="note" x="24" y="390">The cluster at 10–20% is 17 cores nearly every arm failed; the spread above 60% is unanswerable cores nearly every arm declined.</text>
<text class="note" x="24" y="406">Both are suite-pruning signals, not packaging results.</text>
</svg>
