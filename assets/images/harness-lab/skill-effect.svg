<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="1140" height="600" role="img" aria-label="What a hand-written skill actually buys">
<style>
  svg {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --s1: #2a78d6;
    --s2: #eb6834;
    --quiet1: #c9c8c2;
    --quiet2: #d8d7d2;
    --quiet3: #e4e3de;
    --quiet4: #eeede9;
    font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --s1: #3987e5;
      --s2: #d95926;
      --quiet1: #4a4a46;
      --quiet2: #3d3d39;
      --quiet3: #343431;
      --quiet4: #2c2c29;
    }
  }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .lbl { fill: var(--ink2); font-size: 12px; }
  .lbl-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 10.5px; }
  .s1 { fill: var(--s1); }
  .s2 { fill: var(--s2); }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" x="0" y="0" width="760" height="400"/>
<text class="title" x="24" y="30">What a hand-written skill actually buys</text>
<text class="sub" x="24" y="49">Same skill file, three packagings · before → after</text>
<text class="lbl" x="210" y="88">abstention</text>
<text class="note" x="210" y="103">share of unanswerable tasks declined</text>
<text class="lbl-strong" x="24" y="154">A1 → B1-auth</text>
<line class="axis" x1="210" y1="172" x2="420" y2="172"/>
<line x1="348.1" y1="150" x2="406.9" y2="150" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="348.1" cy="150" r="6"/>
<circle class="s1 ring" cx="406.9" cy="150" r="6"/>
<text class="note" x="338.1" y="154" text-anchor="end">88%</text>
<text class="lbl-strong" x="416.9" y="154">99%</text>
<text class="lbl-strong" x="24" y="216">A2 → B2-auth</text>
<line class="axis" x1="210" y1="234" x2="420" y2="234"/>
<line x1="261.1" y1="212" x2="410.0" y2="212" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="261.1" cy="212" r="6"/>
<circle class="s1 ring" cx="410.0" cy="212" r="6"/>
<text class="note" x="251.1" y="216" text-anchor="end">70%</text>
<text class="lbl-strong" x="420.0" y="216">100%</text>
<text class="lbl-strong" x="24" y="278">D1 → D2-auth</text>
<line class="axis" x1="210" y1="296" x2="420" y2="296"/>
<line x1="264.2" y1="274" x2="398.5" y2="274" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="264.2" cy="274" r="6"/>
<circle class="s1 ring" cx="398.5" cy="274" r="6"/>
<text class="note" x="254.2" y="278" text-anchor="end">71%</text>
<text class="lbl-strong" x="408.5" y="278">98%</text>
<text class="lbl" x="516" y="88">fabricated answers</text>
<text class="note" x="516" y="103">count, of 180 unanswerable</text>
<line class="axis" x1="516" y1="172" x2="726" y2="172"/>
<line x1="569.5" y1="150" x2="519.8" y2="150" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="569.5" cy="150" r="6"/>
<circle class="s1 ring" cx="519.8" cy="150" r="6"/>
<text class="lbl-strong" x="509.8" y="154" text-anchor="end">1</text>
<text class="note" x="579.5" y="154">14</text>
<line class="axis" x1="516" y1="234" x2="726" y2="234"/>
<line x1="622.9" y1="212" x2="516.0" y2="212" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="622.9" cy="212" r="6"/>
<circle class="s1 ring" cx="516.0" cy="212" r="6"/>
<text class="lbl-strong" x="506.0" y="216" text-anchor="end">0</text>
<text class="note" x="632.9" y="216">28</text>
<line class="axis" x1="516" y1="296" x2="726" y2="296"/>
<line x1="703.1" y1="274" x2="531.3" y2="274" stroke="var(--axis)" stroke-width="2"/>
<circle class="s2 ring" cx="703.1" cy="274" r="6"/>
<circle class="s1 ring" cx="531.3" cy="274" r="6"/>
<text class="lbl-strong" x="521.3" y="278" text-anchor="end">4</text>
<text class="note" x="713.1" y="278">49</text>
<circle class="s2 ring" cx="216" cy="348" r="6"/>
<text class="lbl" x="230" y="352">bare</text>
<circle class="s1 ring" cx="300" cy="348" r="6"/>
<text class="lbl" x="314" y="352">+ authored skill</text>
<text class="note" x="24" y="362">Abstention moves the same way on every packaging, and fabrication collapses on all three.</text>
<text class="note" x="24" y="380">Success does not — only A2→B2-auth (+8.9 pp) clears the 7.1 pp floor.</text>
</svg>
